---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankappdeployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: bankappcontainer
        image: pavanreddy215/k8sphp:app
        ports:
        - containerPort: 80

      #ConfigMap Integration
        envFrom:
        - configMapRef:
            name: bankappconfigmap

      #resource quota integration
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
      
      #probes integration
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
