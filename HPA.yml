---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bankapphpa
metrics:
  - resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
    type: Resource
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bankappdeployment
  minReplicas: 3
  maxReplicas: 7

