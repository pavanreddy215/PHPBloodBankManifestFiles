apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bankappingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  IngressClassName: nginx
  rules:
    - http:
       paths:
        - path: /
          pathType: Prefix
          backend:
            service:
             name: BankAppService
             port: 
               number: 80
