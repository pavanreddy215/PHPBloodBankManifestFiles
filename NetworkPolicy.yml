---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bankappnetworkpolicy
spec:
  podSelector:
    matchLabels:
      app: myapp
  policyTypes:
  - Ingress
  - Egress
  ingress: 
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
        ports:
         - port: 80
           protocol: TCP
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: myapp-db
        ports:
          - protocol: TCP
            port: 3306         

  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
        ports:
         - port: 53
           protocol: UDP